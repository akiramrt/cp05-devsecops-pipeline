server {
    # Só IPv4: um "listen [::]" derruba o nginx em hosts sem IPv6.
    # O HEALTHCHECK usa 127.0.0.1 e o "docker run -p" chega por IPv4.
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    charset       utf-8;
    charset_types text/css text/plain application/javascript text/javascript image/svg+xml;

    # Não expõe a versão do nginx nos headers e páginas de erro
    server_tokens off;

    # Headers de segurança. A CSP só aceita scripts/estilos do próprio site e,
    # sem 'unsafe-eval', o navegador também bloqueia eval() em tempo de execução
    # (defesa em profundidade para a barreira do Semgrep).
    # Atenção: um add_header dentro de um location apaga todos os herdados daqui.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; require-trusted-types-for 'script'; trusted-types 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Usado pelo HEALTHCHECK do Dockerfile e pelo smoke test do pipeline
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Nunca servir arquivos ocultos (.git, .env etc.)
    location ~ /\. {
        deny all;
    }
}
